# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Worker config for the Unchained Stripe backend.
#
# This file is SAFE to commit — it contains NO secrets. The real secret key and
# webhook secret are stored separately in Cloudflare (see stripe-backend/README.md,
# "wrangler secret put"). Only the PUBLIC publishable key and the (public) price
# IDs live here.
# ─────────────────────────────────────────────────────────────────────────────

name = "unchained-stripe-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret variables, readable inside the Worker as `env.<NAME>`.
[vars]
# Public key — safe to expose. Paste your pk_test_... here (and pk_live_... when going live).
STRIPE_PUBLISHABLE_KEY = "pk_test_REPLACE_ME"

# The three Stripe Price IDs you created. The Worker only allows subscriptions to
# these, so a tampered app can't invent a cheaper price.
PRICE_MONTHLY = "price_1TwOpnBivTKGIw4oauwv8dH2"
PRICE_AI      = "price_1TwOqEBivTKGIw4oAV6hPIIA"
PRICE_FOREVER = "price_1TwOqfBivTKGIw4obpv4vTGj"

# Key/value store that remembers who is a paying subscriber (keyed by email).
# Create it once with:  npx wrangler kv namespace create ENTITLEMENTS
# then paste the returned id below.
[[kv_namespaces]]
binding = "ENTITLEMENTS"
id = "9f89af808af94608bb1766dc8b28a98d"

# NOTE: two SECRET values are NOT in this file. Set them once with:
#   npx wrangler secret put STRIPE_SECRET_KEY       (paste sk_test_... / sk_live_...)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET    (paste whsec_... from the webhook step)
