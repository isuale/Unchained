# Be Unchained website: browser cache rules.
# Installed on the server as /etc/httpd/conf.d/beunchained-cache.conf
# (source of truth: website/server/beunchained-cache.conf in the app repo).
#
# HTML pages: browsers may keep a copy but must check with the server before
# reusing it ("no-cache" = always revalidate). An unchanged page costs a tiny
# 304 "Not Modified" reply; a changed page is downloaded fresh immediately.
# Without this, browsers guessed from Last-Modified and kept old pages for days.
#
# CSS is linked as styles.css?v=<date>; bump that number in the HTML when the
# stylesheet changes and every browser/Cloudflare fetches the new one.

<Directory "/var/www/html">
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>
